<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-86" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow-86" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-86" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="600" rx="36" fill="url(#bg-grad-86)"/>
  <rect x="2" y="2" width="596" height="596" rx="34" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="300" cy="270" r="180" fill="url(#glow-86)"/>

  <!-- Top Category / Difficulty Badge -->
  <g transform="translate(40, 40)">
    <rect width="130" height="40" rx="20" fill="#ec4899" opacity="0.25"/>
    <rect width="130" height="40" rx="20" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="25" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">JUN</text>
  </g>

  

  <!-- Main Hero Icon (Rendered large and crisp) -->
  <g transform="translate(300, 275)" filter="url(#shadow-86)">
    <circle cx="0" cy="0" r="125" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
    <text x="0" y="55" font-size="120" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧶</text>
  </g>

  <!-- Item Title & Subtitle -->
  <g transform="translate(300, 470)">
    <text x="0" y="0" fill="#ffffff" font-size="26" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">Eski jun sviter</text>
    <text x="0" y="32" fill="#94a3b8" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Toifa: TEKSTIL • Qiyinlik: EASY</text>
    <text x="0" y="60" fill="#ec4899" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Ekologik Tafakkur Platformasi</text>
  </g>
</svg>